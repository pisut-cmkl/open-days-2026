<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <title>Smash Brawl Prototype</title>
        <style>
          * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
          }
          html,
          body {
            margin: 0;
            height: 100%;
            background: #0b1020;
            color: #e8eefc;
            font-family: Segoe UI, system-ui, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
          }
          #app {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            touch-action: none;
          }
          canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
          }
        </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
